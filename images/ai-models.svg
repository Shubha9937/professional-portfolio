<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Neural Network & AI Spark Model Icon -->
  <g filter="url(#glow)">
    <!-- Central AI Neural Core (Hexagonal Circuit / Brain Matrix) -->
    <path d="M64 16L102 38v44L64 104 26 82V38L64 16z" fill="none" stroke="url(#aiBgGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

    <!-- Inner Generative 8-Point Spark / Star -->
    <path d="M64 28 C64 48 48 64 28 64 C48 64 64 80 64 100 C64 80 80 64 100 64 C80 64 64 48 64 28 Z" fill="url(#aiBgGrad)"/>

    <!-- Diagonal Sparks -->
    <path d="M64 44 C64 56 56 64 44 64 C56 64 64 72 64 84 C64 72 72 64 84 64 C72 64 64 56 64 44 Z" fill="url(#aiGlow)" opacity="0.85"/>

    <!-- Surrounding Synaptic Nodes -->
    <circle cx="64" cy="16" r="4.5" fill="#06B6D4"/>
    <circle cx="102" cy="38" r="4.5" fill="#8B5CF6"/>
    <circle cx="102" cy="82" r="4.5" fill="#EC4899"/>
    <circle cx="64" cy="104" r="4.5" fill="#3B82F6"/>
    <circle cx="26" cy="82" r="4.5" fill="#06B6D4"/>
    <circle cx="26" cy="38" r="4.5" fill="#A855F7"/>

    <!-- Connecting Neural Nodes -->
    <line x1="64" y1="16" x2="64" y2="28" stroke="#06B6D4" stroke-width="2.5" stroke-dasharray="2,2"/>
    <line x1="102" y1="38" x2="88" y2="50" stroke="#8B5CF6" stroke-width="2.5" stroke-dasharray="2,2"/>
    <line x1="102" y1="82" x2="88" y2="78" stroke="#EC4899" stroke-width="2.5" stroke-dasharray="2,2"/>
    <line x1="64" y1="104" x2="64" y2="100" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="2,2"/>
    <line x1="26" y1="82" x2="40" y2="78" stroke="#06B6D4" stroke-width="2.5" stroke-dasharray="2,2"/>
    <line x1="26" y1="38" x2="40" y2="50" stroke="#A855F7" stroke-width="2.5" stroke-dasharray="2,2"/>

    <!-- Center Bright Core -->
    <circle cx="64" cy="64" r="5" fill="#FFFFFF"/>
  </g>
</svg>
